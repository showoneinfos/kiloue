<style>
  :root{--teal:#00A693;--teal2:#008577;--teal-light:#E8F7F5;--ink:#1A1A1A;--ink2:#666;--ink3:#999;--border:#E5E5E5;--bg:#FAFAFA;--white:#fff;--sans:'Inter',system-ui,sans-serif;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);}
  nav{background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;}
  .nav-top{height:60px;display:flex;align-items:center;padding:0 24px;gap:16px;}
  .logo{font-size:22px;font-weight:700;color:var(--teal);text-decoration:none;white-space:nowrap;}
  .logo span{color:var(--ink);}
  .nav-search{flex:1;max-width:480px;display:flex;align-items:center;background:var(--bg);border:1.5px solid var(--border);border-radius:6px;padding:0 12px;height:40px;gap:8px;}
  .nav-search svg{width:16px;height:16px;fill:none;stroke:var(--ink3);stroke-width:2;flex-shrink:0;}
  .nav-search input{border:none;outline:none;background:transparent;font-family:var(--sans);font-size:14px;color:var(--ink);flex:1;}
  .nav-search input::placeholder{color:var(--ink3);}
  .nav-actions{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .btn-login{padding:8px 16px;border-radius:6px;border:1.5px solid var(--border);background:var(--white);font-size:13px;font-weight:500;font-family:var(--sans);color:var(--ink);cursor:pointer;white-space:nowrap;}
  .btn-login:hover{border-color:var(--teal);color:var(--teal);}
  .btn-sell{padding:8px 18px;border-radius:6px;border:none;background:var(--teal);font-size:13px;font-weight:600;font-family:var(--sans);color:var(--white);cursor:pointer;white-space:nowrap;}
  .btn-sell:hover{background:var(--teal2);}
  .cats-bar{border-top:1px solid var(--border);height:44px;display:flex;align-items:center;padding:0 24px;gap:0;overflow-x:auto;}
  .cats-bar::-webkit-scrollbar{display:none;}
  .cat-tab{padding:0 14px;height:44px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink2);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s;}
  .cat-tab:hover,.cat-tab.active{color:var(--teal);border-bottom-color:var(--teal);}
  .cat-tab svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;flex-shrink:0;}
  .breadcrumb{padding:12px 24px;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px;background:var(--white);border-bottom:1px solid var(--border);}
  .breadcrumb a{color:var(--ink2);text-decoration:none;}
  .breadcrumb a:hover{color:var(--teal);}
  .breadcrumb svg{width:12px;height:12px;fill:none;stroke:var(--ink3);stroke-width:2;}
  .bc-current{color:var(--ink);font-weight:500;}
  .page-content{max-width:1200px;margin:0 auto;padding:28px 24px;}
  .page-title{font-size:22px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  .page-sub{font-size:14px;color:var(--ink2);margin-bottom:28px;}
  .all-cats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:40px;}
  .all-cat-card{background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all .15s;text-decoration:none;display:flex;align-items:center;gap:12px;}
  .all-cat-card:hover{border-color:var(--teal);background:var(--teal-light);}
  .cat-icon-box{width:36px;height:36px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;}
  .all-cat-card:hover .cat-icon-box{background:rgba(0,166,147,.15);}
  .cat-icon-box svg{width:18px;height:18px;fill:none;stroke:var(--ink2);stroke-width:1.8;}
  .all-cat-card:hover .cat-icon-box svg{stroke:var(--teal);}
  .cat-card-info .name{font-size:14px;font-weight:500;color:var(--ink);}
  .all-cat-card:hover .cat-card-info .name{color:var(--teal);}
  .cat-card-info .count{font-size:12px;color:var(--ink3);margin-top:2px;}
  .subcat-view{display:none;}
  .subcat-view.active{display:block;}
  .subcat-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
  .subcat-header h1{font-size:20px;font-weight:700;color:var(--ink);}
  .subcat-header .cat-icon-lg{width:44px;height:44px;border-radius:10px;background:var(--teal-light);display:flex;align-items:center;justify-content:center;}
  .subcat-header .cat-icon-lg svg{width:22px;height:22px;fill:none;stroke:var(--teal);stroke-width:1.8;}
  .subcat-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;}
  .subcat-chip{padding:7px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);font-size:13px;color:var(--ink2);cursor:pointer;transition:all .15s;}
  .subcat-chip:hover,.subcat-chip.active{background:var(--teal);border-color:var(--teal);color:#fff;}
  .results-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border);}
  .results-info{font-size:14px;color:var(--ink2);}
  .results-info strong{color:var(--ink);}
  .sort-sel{padding:8px 14px;border-radius:6px;border:1.5px solid var(--border);background:var(--white);font-size:13px;font-family:var(--sans);color:var(--ink);cursor:pointer;outline:none;}
  .sort-sel:focus{border-color:var(--teal);}
  .listings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
  .lcard{cursor:pointer;background:transparent;border:none;transition:transform .15s;}
  .lcard:hover{transform:translateY(-3px);}
  .lcard-img-w{position:relative;border-radius:10px;overflow:hidden;background:#f0f0f0;}
  .lcard-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;}
  .lcard-fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;box-shadow:0 1px 4px rgba(0,0,0,.15);}
  .lcard-fav svg{width:14px;height:14px;fill:none;stroke:#666;stroke-width:2;}
  .lcard-fav:hover svg{stroke:#e53935;}
  .lcard-body{padding:8px 2px 4px;}
  .lcard-name{font-size:13px;font-weight:500;color:var(--ink);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lcard-meta{font-size:11px;color:var(--ink3);margin-bottom:4px;}
  .lcard-bot{display:flex;align-items:center;gap:6px;}
  .lcard-price{font-size:14px;font-weight:700;color:var(--ink);}
  .lcard-price small{font-size:10px;font-weight:400;color:var(--ink3);}
  .lcard-badge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500;}
  .bl{background:#E8F7F5;color:#008577;}
  .bc{background:#F5F5F5;color:#666;}
  @media(max-width:768px){
    .nav-top{padding:0 16px;}
    .cats-bar{padding:0 8px;}
    .cat-tab{padding:0 10px;font-size:12px;}
    .page-content{padding:16px;}
    .all-cats-grid{grid-template-columns:1fr 1fr;}
    .listings-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  }
</style>
</head>

function svgIcon(paths, size){
  size = size||18;
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="'+size+'" height="'+size+'">'+paths+'</svg>';
}

function renderAllCats(){
  const grid = document.getElementById('all-cats-grid');
  grid.innerHTML = CATS.map(function(c){
    return '<div class="all-cat-card" onclick="selectTabByKey(\''+c.key+'\')">'
      + '<div class="cat-icon-box">'+svgIcon(c.icon)+'</div>'
      + '<div class="cat-card-info">'
      + '<div class="name">'+c.name+'</div>'
      + '<div class="count">'+(c.subs.length-1)+' sous-catégories</div>'
      + '</div></div>';
  }).join('');
}

function renderCatViews(){
  const wrap = document.getElementById('cat-views');
  wrap.innerHTML = CATS.map(function(c){
    return '<div id="view-'+c.key+'" class="subcat-view">'
      + '<div class="subcat-header"><div class="cat-icon-lg">'+svgIcon(c.icon,22)+'</div><h1>'+c.name+'</h1></div>'
      + '<div class="subcat-chips" id="chips-'+c.key+'">'
      + c.subs.map(function(s,i){ return '<div class="subcat-chip'+(i===0?' active':'')+'" onclick="selChip(this,\''+c.key+'\',\''+s+'\')">'+s+'</div>'; }).join('')
      + '</div>'
      + '<div class="results-bar"><span class="results-info"><strong id="count-'+c.key+'">—</strong> annonces</span>'
      + '<select class="sort-sel" onchange="sortGrid(\''+c.key+'\',this.value)"><option value="recent">Plus récentes</option><option value="asc">Prix croissant</option><option value="desc">Prix décroissant</option></select></div>'
      + '<div class="listings-grid" id="grid-'+c.key+'"><div style="grid-column:1/-1;text-align:center;padding:40px;color:#999;font-size:14px;">Chargement…</div></div>'
      + '</div>';
  }).join('');
}

const CAT_NAMES = {all:'Toutes les catégories'};
CATS.forEach(function(c){ CAT_NAMES[c.key] = c.name; });

function selectTab(el, key){
  document.querySelectorAll('.cat-tab').forEach(function(t){ t.classList.remove('active'); });
  if(el) el.classList.add('active');
  document.querySelectorAll('.subcat-view').forEach(function(v){ v.classList.remove('active'); });
  document.getElementById('view-'+key).classList.add('active');
  document.getElementById('bc-text').textContent = CAT_NAMES[key]||key;
  if(key !== 'all') loadGrid(key);
  window.scrollTo(0,0);
}

function selectTabByKey(key){
  const el = document.querySelector('[data-cat="'+key+'"]');
  selectTab(el, key);
}

function selChip(el, catKey, sub){
  el.closest('.subcat-chips').querySelectorAll('.subcat-chip').forEach(function(c){ c.classList.remove('active'); });
  el.classList.add('active');
  filterGrid(catKey, sub === 'Tout voir' ? null : sub);
}

let db = null;
const gridData = {};

function ensureDB(cb){
  if(db){ cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
  s.onload = function(){ db = supabase.createClient(SUPA_URL, SUPA_KEY); cb(); };
  document.head.appendChild(s);
}

function loadGrid(key, sort){
  const cat = CATS.find(function(c){ return c.key === key; });
  if(!cat) return;
  const grid = document.getElementById('grid-'+key);
  if(!grid) return;
  if(gridData[key] && !sort){ renderCards(key, gridData[key]); return; }
  grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#999;font-size:14px;">Chargement…</div>';
  ensureDB(async function(){
    let q = db.from('annonces').select('*').eq('categorie', cat.dbName).eq('disponible', true);
    if(sort === 'asc') q = q.order('prix_jour', {ascending:true});
    else if(sort === 'desc') q = q.order('prix_jour', {ascending:false});
    else q = q.order('created_at', {ascending:false});
    const { data, error } = await q;
    if(error || !data || data.length === 0){
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:48px;color:#999;font-size:14px;">Aucune annonce dans cette catégorie pour le moment.</div>';
      document.getElementById('count-'+key).textContent = '0';
      return;
    }
    gridData[key] = data;
    renderCards(key, data);
  });
}

function filterGrid(key, sous){
  const data = gridData[key];
  if(!data) return;
  const filtered = sous ? data.filter(function(a){ return a.sous_categorie === sous; }) : data;
  renderCards(key, filtered);
}

function sortGrid(key, val){ loadGrid(key, val); }

function renderCards(key, items){
  const grid = document.getElementById('grid-'+key);
  if(!grid) return;
  document.getElementById('count-'+key).textContent = items.length;
  if(items.length === 0){
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:48px;color:#999;font-size:14px;">Aucune annonce pour ce filtre.</div>';
    return;
  }
  const now = new Date();
  grid.innerHTML = items.map(function(a){
    const isBoosted = a.boost_expire && new Date(a.boost_expire) > now;
    const photo = a.photos && a.photos.length > 0 ? a.photos[0] : '';
    const imgHtml = photo
      ? '<img class="lcard-img" src="'+photo+'" alt="'+a.titre+'" loading="lazy">'
      : '<div class="lcard-img" style="display:flex;align-items:center;justify-content:center;background:#f5f5f5;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>';
    const boostBadge = isBoosted ? '<div style="position:absolute;top:8px;left:8px;background:linear-gradient(135deg,#FF6B35,#FF8E53);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;">★ À la une</div>' : '';
    const cardStyle = isBoosted ? 'box-shadow:0 0 0 2px #FF6B35;border-radius:10px;' : '';
    return '<div class="lcard" onclick="window.location.href=\'annonce.html?id='+a.id+'\'" style="'+cardStyle+'">'
      + '<div class="lcard-img-w">'+imgHtml+boostBadge
      + '<button class="lcard-fav" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>'
      + '</div>'
      + '<div class="lcard-body">'
      + '<div class="lcard-name">'+a.titre+'</div>'
      + '<div class="lcard-meta">'+(a.ville||'')+'</div>'
      + '<div class="lcard-bot"><div class="lcard-price">'+a.prix_jour+'€<small>/j</small></div>'
      + (a.livraison ? '<div class="lcard-badge bl">Livraison</div>' : '<div class="lcard-badge bc">Sur place</div>')
      + '</div></div></div>';
  }).join('');
}

  renderAllCats();
  renderCatViews();
  const p = new URLSearchParams(window.location.search).get('cat');
  if(p) selectTabByKey(p);
