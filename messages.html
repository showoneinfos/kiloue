<!DOCTYPE html>
<html lang="fr">
<head>
<script>
  if(/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 768){
    window.location.replace('mobile.html');
  }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — kiloue.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--teal:#00A693;--teal2:#008577;--teal-light:#E8F7F5;--ink:#1A1A1A;--ink2:#666;--ink3:#999;--border:#E5E5E5;--bg:#FAFAFA;--white:#fff;--sans:'Inter',system-ui,sans-serif;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

  /* NAV */
  nav{background:var(--white);border-bottom:1px solid var(--border);height:60px;display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0;z-index:10;}
  .logo{font-size:20px;font-weight:700;color:var(--teal);text-decoration:none;}
  .logo span{color:var(--ink);}
  .nav-title{font-size:16px;font-weight:600;color:var(--ink);}
  .nav-back{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);text-decoration:none;padding:7px 14px;border-radius:6px;border:1.5px solid var(--border);background:var(--white);}
  .nav-back:hover{border-color:var(--teal);color:var(--teal);}
  .nav-back svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;}

  /* LAYOUT */
  .chat-layout{display:grid;grid-template-columns:320px 1fr;flex:1;overflow:hidden;}

  /* LISTE CONVERSATIONS */
  .conv-list{border-right:1px solid var(--border);background:var(--white);display:flex;flex-direction:column;overflow:hidden;}
  .conv-list-header{padding:16px 18px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600;color:var(--ink);flex-shrink:0;}
  .conv-items{overflow-y:auto;flex:1;}
  .conv-item{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s;}
  .conv-item:hover{background:var(--bg);}
  .conv-item.active{background:var(--teal-light);}
  .conv-avatar{width:42px;height:42px;border-radius:50%;background:var(--teal-light);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--teal2);flex-shrink:0;object-fit:cover;}
  .conv-info{flex:1;min-width:0;}
  .conv-name{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:3px;}
  .conv-item.active .conv-name{color:var(--teal2);}
  .conv-preview{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .conv-preview.unread{color:var(--ink);font-weight:500;}
  .conv-meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
  .conv-time{font-size:11px;color:var(--ink3);}
  .conv-badge{width:18px;height:18px;border-radius:50%;background:var(--teal);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .conv-empty{padding:40px 20px;text-align:center;color:var(--ink3);font-size:13px;}

  /* ZONE CHAT */
  .chat-area{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
  .chat-header{background:var(--white);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .chat-header-av{width:38px;height:38px;border-radius:50%;background:var(--teal-light);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--teal2);flex-shrink:0;}
  .chat-header-name{font-size:14px;font-weight:600;color:var(--ink);}
  .chat-header-sub{font-size:12px;color:var(--ink3);margin-top:1px;}
  .chat-header-annonce{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .annonce-chip{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--white);cursor:pointer;text-decoration:none;}
  .annonce-chip:hover{border-color:var(--teal);}
  .annonce-chip-img{width:32px;height:32px;border-radius:6px;object-fit:cover;background:var(--bg);}
  .annonce-chip-name{font-size:12px;font-weight:500;color:var(--ink);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .annonce-chip-price{font-size:11px;color:var(--teal);font-weight:600;}

  /* MESSAGES */
  .messages-wrap{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;}
  .msg{display:flex;align-items:flex-end;gap:8px;max-width:70%;}
  .msg.me{align-self:flex-end;flex-direction:row-reverse;}
  .msg.other{align-self:flex-start;}
  .msg-av{width:28px;height:28px;border-radius:50%;background:var(--teal-light);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--teal2);flex-shrink:0;}
  .msg-bubble{padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.5;max-width:100%;}
  .msg.me .msg-bubble{background:var(--teal);color:#fff;border-bottom-right-radius:4px;}
  .msg.other .msg-bubble{background:var(--white);color:var(--ink);border:1px solid var(--border);border-bottom-left-radius:4px;}
  .msg-time{font-size:10px;color:var(--ink3);margin-bottom:4px;white-space:nowrap;}
  .msg.me .msg-time{text-align:right;}
  .msg-date-sep{text-align:center;font-size:11px;color:var(--ink3);padding:8px 0;align-self:center;}

  /* INPUT */
  .chat-input-wrap{background:var(--white);border-top:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .chat-input{flex:1;border:1.5px solid var(--border);border-radius:24px;padding:10px 16px;font-size:14px;font-family:var(--sans);color:var(--ink);outline:none;resize:none;line-height:1.4;max-height:100px;overflow-y:auto;}
  .chat-input:focus{border-color:var(--teal);}
  .btn-send{width:40px;height:40px;border-radius:50%;background:var(--teal);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;}
  .btn-send:hover{background:var(--teal2);}
  .btn-send svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;}
  .btn-send:disabled{background:var(--border);cursor:not-allowed;}

  /* PLACEHOLDER CHAT */
  .chat-placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink3);gap:12px;}
  .chat-placeholder svg{width:48px;height:48px;fill:none;stroke:var(--border);stroke-width:1.5;}
  .chat-placeholder p{font-size:14px;}

  /* LOADING */
  .loading-msgs{text-align:center;padding:20px;color:var(--ink3);font-size:13px;}
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">kiloue<span>.com</span></a>
  <div class="nav-title">Messages</div>
  <a class="nav-back" href="profil.html" style="margin-left:auto;">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Mon espace
  </a>
</nav>

<div class="chat-layout">

  <!-- LISTE DES CONVERSATIONS -->
  <div class="conv-list">
    <div class="conv-list-header">Conversations</div>
    <div class="conv-items" id="conv-items">
      <div class="conv-empty">Chargement…</div>
    </div>
  </div>

  <!-- ZONE CHAT -->
  <div class="chat-area" id="chat-area">
    <div class="chat-placeholder" id="chat-placeholder">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <p>Sélectionnez une conversation</p>
    </div>
  </div>

</div>

<script>
const SUPA_URL = 'https://nsvosbuxkpnoasfilyqy.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zdm9zYnV4a3Bub2FzZmlseXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxODczOTcsImV4cCI6MjA5NTc2MzM5N30.pTuH4X8IQy0UJq8zUZ8t7I2WLMEUXae_8nWdtIFrpRE';

let db, currentUser, currentConv = null, realtimeSub = null;

/* ── UTILS ── */
function fmtTime(ts){
  const d = new Date(ts);
  const now = new Date();
  const diff = now - d;
  if(diff < 86400000) return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  if(diff < 604800000) return d.toLocaleDateString('fr-FR',{weekday:'short'});
  return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}

function initials(prenom, nom){
  return ((prenom||'?')[0] + (nom||'?')[0]).toUpperCase();
}

/* ── CHARGEMENT CONVERSATIONS ── */
async function loadConversations(){
  // Récupérer tous les messages où je suis expéditeur ou destinataire
  const { data, error } = await db
    .from('messages')
    .select('*, annonces(id,titre,photos,prix_jour), expediteur:utilisateurs!expediteur_id(id,prenom,nom,avatar_url), destinataire:utilisateurs!destinataire_id(id,prenom,nom,avatar_url)')
    .or(`expediteur_id.eq.${currentUser.id},destinataire_id.eq.${currentUser.id}`)
    .order('created_at', {ascending:false});

  if(error || !data || data.length === 0){
    document.getElementById('conv-items').innerHTML = '<div class="conv-empty">Aucune conversation pour le moment.</div>';
    return;
  }

  // Grouper par conversation (annonce_id + autre_utilisateur_id)
  const convMap = {};
  data.forEach(msg => {
    const autreUser = msg.expediteur_id === currentUser.id ? msg.destinataire : msg.expediteur;
    const key = (msg.annonce_id||'noannonce') + '_' + (autreUser?.id||'');
    if(!convMap[key]){
      convMap[key] = {
        key,
        annonce: msg.annonces,
        autreUser,
        dernierMsg: msg,
        nonLus: 0
      };
    }
    // Compter non lus (messages reçus non lus)
    if(msg.destinataire_id === currentUser.id && !msg.lu){
      convMap[key].nonLus++;
    }
  });

  const convs = Object.values(convMap);
  const el = document.getElementById('conv-items');
  if(convs.length === 0){
    el.innerHTML = '<div class="conv-empty">Aucune conversation pour le moment.</div>';
    return;
  }

  el.innerHTML = convs.map(c => {
    const u = c.autreUser || {};
    const nom = [u.prenom, u.nom].filter(Boolean).join(' ') || 'Utilisateur';
    const av = u.avatar_url
      ? `<img class="conv-avatar" src="${u.avatar_url}" alt="">`
      : `<div class="conv-avatar">${initials(u.prenom, u.nom)}</div>`;
    const preview = c.dernierMsg.contenu.substring(0, 50) + (c.dernierMsg.contenu.length > 50 ? '…' : '');
    const isUnread = c.nonLus > 0;
    return `<div class="conv-item" id="conv-${c.key}" onclick="openConv(${JSON.stringify(c).replace(/"/g,'&quot;')})">
      ${av}
      <div class="conv-info">
        <div class="conv-name">${nom}</div>
        <div class="conv-preview${isUnread?' unread':''}">${c.annonce?c.annonce.titre+' · ':''}${preview}</div>
      </div>
      <div class="conv-meta">
        <div class="conv-time">${fmtTime(c.dernierMsg.created_at)}</div>
        ${isUnread?`<div class="conv-badge">${c.nonLus}</div>`:''}
      </div>
    </div>`;
  }).join('');

  // Ouvrir la conversation depuis l'URL si ?annonce_id=X&avec=Y
  const params = new URLSearchParams(window.location.search);
  const annonceId = params.get('annonce_id');
  const avecId = params.get('avec');
  if(annonceId && avecId){
    const key = annonceId + '_' + avecId;
    const conv = convMap[key];
    if(conv) openConv(conv);
    else startNewConv(annonceId, avecId);
  }
}

/* ── OUVRIR UNE CONVERSATION ── */
async function openConv(conv){
  currentConv = conv;

  // Mettre en actif dans la liste
  document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
  const convEl = document.getElementById('conv-'+conv.key);
  if(convEl) convEl.classList.add('active');

  const u = conv.autreUser || {};
  const nom = [u.prenom, u.nom].filter(Boolean).join(' ') || 'Utilisateur';
  const av = u.avatar_url
    ? `<img class="chat-header-av" style="width:38px;height:38px;border-radius:50%;object-fit:cover;" src="${u.avatar_url}" alt="">`
    : `<div class="chat-header-av">${initials(u.prenom, u.nom)}</div>`;

  // Header annonce
  let annonceHtml = '';
  if(conv.annonce){
    const photo = conv.annonce.photos && conv.annonce.photos.length > 0 ? conv.annonce.photos[0] : '';
    annonceHtml = `<div class="chat-header-annonce">
      <a class="annonce-chip" href="annonce.html?id=${conv.annonce.id}">
        ${photo?`<img class="annonce-chip-img" src="${photo}" alt="">`:`<div class="annonce-chip-img" style="background:#f0f0f0;"></div>`}
        <div>
          <div class="annonce-chip-name">${conv.annonce.titre}</div>
          <div class="annonce-chip-price">${conv.annonce.prix_jour}€/j</div>
        </div>
      </a>
    </div>`;
  }

  const chatArea = document.getElementById('chat-area');
  chatArea.innerHTML = `
    <div class="chat-header">
      ${av}
      <div>
        <div class="chat-header-name">${nom}</div>
        <div class="chat-header-sub" id="chat-status">En ligne</div>
      </div>
      ${annonceHtml}
    </div>
    <div class="messages-wrap" id="messages-wrap">
      <div class="loading-msgs">Chargement…</div>
    </div>
    <div class="chat-input-wrap">
      <textarea class="chat-input" id="chat-input" placeholder="Écrivez un message…" rows="1" onkeydown="handleKey(event)"></textarea>
      <button class="btn-send" id="btn-send" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>`;

  await loadMessages(conv);
  subscribeRealtime(conv);

  // Marquer comme lus
  markAsRead(conv);
}

/* ── CHARGER LES MESSAGES ── */
async function loadMessages(conv){
  const u = conv.autreUser || {};
  const autreId = u.id;

  const { data } = await db
    .from('messages')
    .select('*')
    .eq('annonce_id', conv.annonce?.id || null)
    .or(`and(expediteur_id.eq.${currentUser.id},destinataire_id.eq.${autreId}),and(expediteur_id.eq.${autreId},destinataire_id.eq.${currentUser.id})`)
    .order('created_at', {ascending:true});

  renderMessages(data || []);
}

/* ── RENDU MESSAGES ── */
function renderMessages(msgs){
  const wrap = document.getElementById('messages-wrap');
  if(!wrap) return;
  if(msgs.length === 0){
    wrap.innerHTML = '<div class="loading-msgs">Aucun message. Commencez la conversation !</div>';
    return;
  }

  let html = '';
  let lastDate = '';
  msgs.forEach(msg => {
    const isMe = msg.expediteur_id === currentUser.id;
    const d = new Date(msg.created_at);
    const dateStr = d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
    if(dateStr !== lastDate){
      html += `<div class="msg-date-sep">${dateStr}</div>`;
      lastDate = dateStr;
    }
    const time = d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    html += `<div class="msg ${isMe?'me':'other'}">
      <div class="msg-bubble">${escHtml(msg.contenu)}</div>
      <div class="msg-time">${time}${isMe&&msg.lu?' · Lu':''}</div>
    </div>`;
  });

  wrap.innerHTML = html;
  wrap.scrollTop = wrap.scrollHeight;
}

function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

/* ── ENVOYER UN MESSAGE ── */
async function sendMessage(){
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('btn-send');
  if(!input || !currentConv) return;
  const txt = input.value.trim();
  if(!txt) return;

  btn.disabled = true;
  input.value = '';

  const autreId = currentConv.autreUser?.id;
  const { error } = await db.from('messages').insert([{
    expediteur_id:   currentUser.id,
    destinataire_id: autreId,
    annonce_id:      currentConv.annonce?.id || null,
    contenu:         txt,
    lu:              false
  }]);

  btn.disabled = false;
  if(error){ alert('Erreur envoi : '+error.message); input.value = txt; }
}

function handleKey(e){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
}

/* ── REALTIME ── */
function subscribeRealtime(conv){
  if(realtimeSub) db.removeChannel(realtimeSub);

  realtimeSub = db.channel('messages-'+conv.key)
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'messages'
    }, payload => {
      const msg = payload.new;
      const autreId = conv.autreUser?.id;
      const isRelevant =
        (msg.expediteur_id === currentUser.id && msg.destinataire_id === autreId) ||
        (msg.expediteur_id === autreId && msg.destinataire_id === currentUser.id);
      if(!isRelevant) return;

      const wrap = document.getElementById('messages-wrap');
      if(!wrap) return;
      const isMe = msg.expediteur_id === currentUser.id;
      const time = new Date(msg.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
      const div = document.createElement('div');
      div.className = 'msg '+(isMe?'me':'other');
      div.innerHTML = `<div class="msg-bubble">${escHtml(msg.contenu)}</div><div class="msg-time">${time}</div>`;
      wrap.appendChild(div);
      wrap.scrollTop = wrap.scrollHeight;

      if(!isMe) markAsRead(conv);
      loadConversations(); // Rafraîchir la liste
    })
    .subscribe();
}

/* ── MARQUER COMME LUS ── */
async function markAsRead(conv){
  const autreId = conv.autreUser?.id;
  await db.from('messages')
    .update({lu: true})
    .eq('destinataire_id', currentUser.id)
    .eq('expediteur_id', autreId);
}

/* ── NOUVELLE CONVERSATION (depuis annonce.html) ── */
async function startNewConv(annonceId, avecId){
  const [annonceRes, userRes] = await Promise.all([
    db.from('annonces').select('id,titre,photos,prix_jour').eq('id',annonceId).single(),
    db.from('utilisateurs').select('id,prenom,nom,avatar_url').eq('id',avecId).single()
  ]);

  const fakeConv = {
    key: annonceId + '_' + avecId,
    annonce: annonceRes.data,
    autreUser: userRes.data,
    dernierMsg: { contenu: '', created_at: new Date().toISOString() },
    nonLus: 0
  };
  openConv(fakeConv);
}

/* ── INIT ── */
(function(){
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
  s.onload = async function(){
    db = supabase.createClient(SUPA_URL, SUPA_KEY);
    const { data: { user } } = await db.auth.getUser();
    if(!user){ window.location.href='inscription.html'; return; }
    currentUser = user;
    await loadConversations();
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
